<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Tool | Rakam Tamang</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="wrap navin"><a class="logo" href="index.html#tools"><span class="monogram">RT</span> Engineering Lab</a><a class="btn small" href="index.html#tools">← Public gallery</a></div></header><div class="wrap" style="padding-top:45px;padding-bottom:50px"><div class="eyebrow">Published app</div><h1 id="name" style="font-size:2.6rem">Loading…</h1><p id="desc"></p><div id="error" class="alert hidden"></div><iframe id="tool-frame" class="preview hidden" title="Published HTML app" sandbox="allow-scripts allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer"></iframe><p class="note" style="margin-top:15px">HTML tools run in an isolated frame. Do not enter private or sensitive information into untrusted demonstrations.</p></div><script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const c=window.PORTFOLIO_CONFIG||{};const id=new URLSearchParams(location.search).get('id');const fail=t=>{document.querySelector('#name').textContent='App unavailable';const e=document.querySelector('#error');e.textContent=t;e.classList.remove('hidden')};if(!id||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY||!c.PUBLIC_OWNER_ID||!window.supabase)fail('The gallery is not configured.');else{const db=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);db.from('portfolio_apps').select('title,description,kind,html_content,url').eq('id',id).eq('owner_id',c.PUBLIC_OWNER_ID).eq('published',true).single().then(({data,error})=>{if(error||!data)return fail('This tool is not currently published.');document.querySelector('#name').textContent=data.title;document.querySelector('#desc').textContent=data.description||'';if(data.kind==='html'){const f=document.querySelector('#tool-frame');f.srcdoc=data.html_content||'';f.classList.remove('hidden')}else if(/^https:\/\//i.test(data.url||'')){location.replace(data.url)}else fail('App URL unavailable.')})}</script></body></html>
